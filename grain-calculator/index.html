<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Multigrain Bread Calculator</title>
        <style>
            :root {
                color-scheme: light;
                --border: #d0d0d0;
                --header-bg: #f4f4f4;
                --accent: #6b4226;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                color: #222;
                background: #fafafa;
            }

            h1 {
                text-align: center;
                padding: 1rem;
                margin: 0;
                background: var(--accent);
                color: #fff;
            }

            .columns {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 1rem;
                padding: 1rem;
                max-width: 1200px;
                margin: 0 auto;
            }

            .column {
                border: 1px solid var(--border);
                border-radius: 6px;
                background: #fff;
                overflow: hidden;
            }

            .column > summary {
                list-style: none;
                cursor: pointer;
                padding: 0.75rem 1rem;
                font-weight: bold;
                background: var(--header-bg);
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .column > summary::-webkit-details-marker {
                display: none;
            }

            /* Chevron indicator, only meaningful on mobile where toggling is enabled */
            .column > summary::after {
                content: "▸";
                transition: transform 0.15s ease;
            }

            .column[open] > summary::after {
                transform: rotate(90deg);
            }

            .column-body {
                padding: 0.75rem 1rem;
            }

            .column-body ul {
                margin: 0;
                padding-left: 1.25rem;
            }

            .column-body li {
                margin-bottom: 0.4rem;
            }

            .ingredient-list label {
                display: block;
                margin-bottom: 0.3rem;
                cursor: pointer;
            }

            .ingredient-group {
                margin-bottom: 0.5rem;
            }

            .ingredient-group .group-label {
                font-weight: bold;
            }

            .ingredient-group .group-items {
                margin-left: 1.25rem;
                padding-top: 0.2rem;
            }

            .product {
                border: 1px solid var(--border);
                border-radius: 4px;
                margin-bottom: 0.5rem;
                overflow: hidden;
            }

            .grain-count {
                font-size: 1.5rem;
                font-weight: bold;
                color: var(--accent);
                min-width: 2ch;
                text-align: right;
            }

            .product-name {
                flex: 1;
            }

            .product-total {
                font-weight: normal;
                font-size: 0.85em;
                color: #555;
            }

            .product > summary {
                list-style: none;
                cursor: pointer;
                padding: 0.5rem 0.75rem;
                background: #fafafa;
                display: flex;
                align-items: baseline;
                gap: 0.75rem;
            }

            .product > summary::-webkit-details-marker {
                display: none;
            }

            .product > summary::after {
                content: "+";
                font-weight: bold;
                margin-left: auto;
            }

            .product[open] > summary::after {
                content: "\2212";
            }

            .product .ingredients {
                padding: 0.5rem 0.75rem 0.75rem 1.5rem;
                margin: 0;
            }

            /* Desktop: columns are always fully expanded, act as static panels */
            @media (min-width: 701px) {
                .column > summary {
                    cursor: default;
                    pointer-events: none;
                }
            }

            /* Mobile: stack into a collapsible accordion */
            @media (max-width: 700px) {
                .columns {
                    display: block;
                }

                .column {
                    margin-bottom: 0.75rem;
                }
            }
        </style>
    </head>
    <body>

        <div class="columns" id="columns">
            <details class="column" open>
                <summary>Must Have</summary>
                <div class="column-body">
                    <div class="ingredient-list" id="must-have-list" data-prefix="mh"></div>
                </div>
            </details>

            <details class="column" open>
                <summary>Must NOT Have</summary>
                <div class="column-body">
                    <div class="ingredient-list" id="must-not-have-list" data-prefix="mn"></div>
                </div>
            </details>

            <details class="column" open>
                <summary>Counts as Grain</summary>
                <div class="column-body">
                    <div class="ingredient-list" id="counts-as-grain-list" data-prefix="cg"></div>
                </div>
            </details>

            <details class="column" open>
                <summary>Adjusted Leaderboard</summary>
                <div class="column-body" id="products-list"></div>
            </details>
        </div>

            // Exact-match lookup from any label seen on a package to its canonical grain name
            var GRAIN_BY_ALIAS = {};
            GRAINS.forEach(function (grain) {
                grain.aliases.forEach(function (alias) {
                    GRAIN_BY_ALIAS[alias.trim().toLowerCase()] = grain.name;
                });
            });

            function canonicalGrainName(ingredient) {
                return GRAIN_BY_ALIAS[ingredient.trim().toLowerCase()] || null;
            }

            function slugify(text) {
                return text.toLowerCase().replace(/[^a-z0-9]+/g, "-");
            }

            function makeItemLabel(prefix, item, defaultChecked) {
                var itemId = prefix + "-" + slugify(item);
                var label = document.createElement("label");
                var checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.id = itemId;
                checkbox.value = item;
                checkbox.checked = !!defaultChecked;
                label.htmlFor = itemId;
                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(" " + item));
                return { label: label, checkbox: checkbox };
            }

            function renderIngredientList(container, defaultChecked) {
                var prefix = container.dataset.prefix;
                var groups = {};
                var groupOrder = [];
                var ungrouped = [];

                GRAINS.forEach(function (grain) {
                    if (!grain.group) {
                        ungrouped.push(grain);
                        return;
                    }
                    if (!groups[grain.group]) {
                        groups[grain.group] = [];
                        groupOrder.push(grain.group);
                    }
                    groups[grain.group].push(grain);
                });

                groupOrder.forEach(function (groupName) {
                    var groupEl = document.createElement("div");
                    groupEl.className = "ingredient-group";

                    var itemsEl = document.createElement("div");
                    itemsEl.className = "group-items";

                    var itemCheckboxes = groups[groupName].map(function (grain) {
                        var built = makeItemLabel(prefix, grain.name, defaultChecked);
                        itemsEl.appendChild(built.label);
                        return built.checkbox;
                    });

                    var groupId = prefix + "-group-" + slugify(groupName);
                    var groupLabel = document.createElement("label");
                    groupLabel.className = "group-label";
                    var groupCheckbox = document.createElement("input");
                    groupCheckbox.type = "checkbox";
                    groupCheckbox.id = groupId;
                    // No value here -- this is a "toggle all" control, not itself a grain term
                    groupCheckbox.value = "";
                    groupLabel.htmlFor = groupId;
                    groupLabel.appendChild(groupCheckbox);
                    groupLabel.appendChild(document.createTextNode(" " + groupName));

                    groupCheckbox.addEventListener("change", function () {
                        itemCheckboxes.forEach(function (cb) {
                            cb.checked = groupCheckbox.checked;
                        });
                    });

                    function syncGroupCheckbox() {
                        var checkedCount = itemCheckboxes.filter(function (cb) {
                            return cb.checked;
                        }).length;
                        groupCheckbox.checked = checkedCount === itemCheckboxes.length;
                        groupCheckbox.indeterminate = checkedCount > 0 && checkedCount < itemCheckboxes.length;
                    }

                    itemCheckboxes.forEach(function (cb) {
                        cb.addEventListener("change", syncGroupCheckbox);
                    });
                    syncGroupCheckbox();

                    groupEl.appendChild(groupLabel);
                    groupEl.appendChild(itemsEl);
                    container.appendChild(groupEl);
                });

                ungrouped.forEach(function (grain) {
                    var built = makeItemLabel(prefix, grain.name, defaultChecked);
                    container.appendChild(built.label);
                });
            }

            document.querySelectorAll("#must-have-list, #must-not-have-list").forEach(function (el) {
                renderIngredientList(el, false);
            });

            function checkedValues(containerId) {
                var container = document.getElementById(containerId);
                return Array.from(container.querySelectorAll("input[type=checkbox]"))
                    .filter(function (cb) { return cb.checked && cb.value; })
                    .map(function (cb) { return cb.value; });
            }

            var productsListEl = document.getElementById("products-list");

            function renderProducts() {
                products.forEach(function (product) {
                    product.canonical = product.ingredients.map(canonicalGrainName);

                    var details = document.createElement("details");

                    product.el = details;
                    product.countEl = count;
                    product.totalEl = total;
                });
            }

            function updateProducts() {
                var mustHave = checkedValues("must-have-list");
                var mustNotHave = checkedValues("must-not-have-list");
                var grainTerms = checkedValues("counts-as-grain-list");

                products.forEach(function (product) {
                    var hasAllMustHave = mustHave.every(function (term) {
                        return product.canonical.indexOf(term) !== -1;
                    });
                    var hasAnyMustNotHave = mustNotHave.some(function (term) {
                        return product.canonical.indexOf(term) !== -1;
                    });
                    var grainCount = product.canonical.filter(function (name) {
                        return name && grainTerms.indexOf(name) !== -1;
                    }).length;

                    product.grainCount = grainCount;
                    product.visible = hasAllMustHave && !hasAnyMustNotHave;
                    product.countEl.textContent = grainCount;
                    product.totalEl.textContent = "(listed " + product.ingredients.length + " ingredients)";
                    product.el.style.display = product.visible ? "" : "none";
                });

                products
                    .slice()
                    .sort(function (a, b) { return b.grainCount - a.grainCount; })
                    .forEach(function (product) {
                        productsListEl.appendChild(product.el);
                    });
            }


            renderProducts();
            updateProducts();
            document.addEventListener("change", function (e) {
                if (e.target.matches("#must-have-list input, #must-not-have-list input, #counts-as-grain-list input")) {
                    updateProducts();
                }
            });
        </script>
    </body>
</html>
